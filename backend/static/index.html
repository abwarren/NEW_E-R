<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E&amp;R PokerBet — Operator Dashboard</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --muted:#8b949e; --green:#3fb950; --red:#f85149; --amber:#d29922; --blue:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:16px; margin:0; }
  #conn { font-size:12px; color:var(--muted); }
  #conn.live { color:var(--green); }
  .grid { display:grid; grid-template-columns: 1fr 380px; gap:12px; padding:12px; }
  @media (max-width:1100px){ .grid { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .panel h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .stale { color:var(--red); font-weight:700; }
  .live { color:var(--green); }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; background:#21262d; border:1px solid var(--line); }
  .badge.street { color:var(--blue); }
  .badge.hero { color:var(--green); }
  .badge.actions { color:var(--amber); }
  .btn { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  .btn:hover { border-color:var(--blue); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.fold { color:var(--red); } .btn.call { color:var(--green); } .btn.raise { color:var(--amber); }
  #log { max-height:240px; overflow:auto; font:11px/1.5 ui-monospace, monospace; color:var(--muted); }
  #log div { padding:1px 0; border-bottom:1px dashed #21262d; }
  .cards { letter-spacing:.12em; font-weight:700; }
  .eqbar { height:14px; background:#21262d; border-radius:7px; overflow:hidden; margin:3px 0; }
  .eqbar > div { height:100%; background:linear-gradient(90deg,#1f6feb,#3fb950); }
  .muted { color:var(--muted); }
  .hero-block { margin-bottom:12px; border:1px solid var(--line); border-radius:8px; padding:8px; }
  .hero-title { font-weight:700; font-size:12px; color:var(--blue); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }
  .eq-card { background:#0d1117; border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-bottom:6px; }
  .eq-card-head { font:11px ui-monospace,monospace; color:var(--fg); margin-bottom:4px; }
  .eq-row { display:flex; justify-content:space-between; font-size:12px; padding:1px 0; }
  .eq-row span { color:var(--muted); }
  .eq-row.pos b { color:var(--green); }
  .eq-row.neg b { color:var(--red); }
  .player-block { margin-bottom:14px; border:1px solid var(--line); border-radius:8px; padding:10px; }
  .player-head { font-weight:700; font-size:14px; margin-bottom:8px; }
  .table-card { background:#0d1117; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:8px; }
  .table-card.stale { border-color:var(--red); }
  .table-head { display:flex; gap:10px; align-items:center; font-size:13px; margin-bottom:6px; flex-wrap:wrap; }
  .table-meta { display:flex; gap:16px; font-size:12px; color:var(--fg); margin-bottom:6px; flex-wrap:wrap; }
  .table-controls { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .btn.act { font-weight:700; }
  .btn.act.fold { color:var(--red); border-color:var(--red); }
  .btn.act.check { color:var(--blue); border-color:var(--blue); }
  .btn.act.call { color:var(--green); border-color:var(--green); }
  .btn.act.bet, .btn.act.raise { color:var(--amber); border-color:var(--amber); }
</style>
</head>
<body>
<header>
  <h1>E&amp;R PokerBet</h1>
  <span id="conn">connecting…</span>
  <span class="muted" id="clock"></span>
</header>

<div class="grid">
  <div class="panel" style="grid-column:1/-1;">
    <h2>Fleet control (remote → player → table → hand)</h2>
    <div id="fleet"><div class="muted">no tables yet — waiting for snapshots…</div></div>
  </div>

  <div class="panel" style="grid-column:1/-1;">
    <h2>Equity (eval7 in-process, directional)</h2>
    <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;">
      <input id="eq-hands" placeholder='[[&quot;As&quot;,&quot;Ks&quot;,&quot;Qh&quot;,&quot;Jh&quot;],[&quot;2c&quot;,&quot;2d&quot;,&quot;2h&quot;,&quot;2s&quot;]]' style="flex:1; min-width:220px; background:#0d1117; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px; font:12px ui-monospace,monospace;">
      <input id="eq-board" placeholder='[&quot;Kd&quot;,&quot;Qc&quot;,&quot;Ts&quot;]' style="width:150px; background:#0d1117; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px; font:12px ui-monospace,monospace;">
      <button class="btn" id="eq-run">Run</button>
    </div>
    <div id="eq-result" class="muted">run a calculation to see directional equity</div>
  </div>

  <div class="panel" style="grid-column:1/-1;">
    <h2>Event log (SSE)</h2>
    <div id="log"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
